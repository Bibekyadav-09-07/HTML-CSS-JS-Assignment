<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apply Styling</title>
  <style>
    .styled-heading { color: blue; }
    .styled-paragraph {
      background-color: lightgray;
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1 id="heading">JavaScript DOM</h1>
  <p id="information">The DOM lets JavaScript update webpage content and styling.</p>
  <button id="applyStyling" type="button">Apply Styling</button>
  <script>
    document.getElementById("applyStyling").addEventListener("click", () => {
      document.getElementById("heading").classList.add("styled-heading");
      document.getElementById("information").classList.add("styled-paragraph");
    });
  </script>
</body>
</html>
