<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Background Color</title>
  <style>
    #message { padding: 1rem; }
  </style>
</head>
<body>
  <p id="message">Choose a color to change this paragraph's background.</p>
  <button type="button" data-color="red">Red</button>
  <button type="button" data-color="green">Green</button>
  <button type="button" data-color="blue">Blue</button>
  <script>
    document.querySelectorAll("button[data-color]").forEach((button) => {
      button.addEventListener("click", () => {
        document.getElementById("message").style.backgroundColor = button.dataset.color;
      });
    });
  </script>
</body>
</html>
