<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Form Validation</title>
</head>
<body>
  <form id="registrationForm" novalidate>
    <label for="name">Name</label>
    <input id="name" type="text">
    <label for="email">Email</label>
    <input id="email" type="text">
    <label for="password">Password</label>
    <input id="password" type="password">
    <button type="submit">Submit</button>
  </form>
  <p id="message" aria-live="polite"></p>
  <script>
    document.getElementById("registrationForm").addEventListener("submit", (event) => {
      event.preventDefault();
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const errors = [];

      if (!name || !email || !password) errors.push("All fields must be filled.");
      if (name.length > 0 && name.length < 3) errors.push("Name must contain at least 3 characters.");
      if (email && !email.includes("@")) errors.push("Email must contain @.");
      if (password && password.length < 6) errors.push("Password must contain at least 6 characters.");

      document.getElementById("message").textContent =
        errors.length > 0 ? errors.join(" ") : "Registration Successful!";
    });
  </script>
</body>
</html>
